name: Code-Coverage

on:
  pull_request:
  push:
    branches: [ master, 'v*-branch', test/ota-tlv-test-case ]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-coverage-${{ (github.event_name == 'pull_request' && github.event.number) || (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read  
  pull-requests: write

jobs:
  linux-coverage:
    name: Coverage
    if: github.actor != 'restyled-io[bot]'

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CC_SLUG: SiliconLabsSoftware/matter_sdk
    
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/project-chip/chip-build:167
      volumes:
        - "/:/runner-root-volume"
        - "/tmp/log_output:/tmp/test_logs"      
      options: --privileged --sysctl "net.ipv6.conf.all.disable_ipv6=0 net.ipv4.conf.all.forwarding=1 net.ipv6.conf.all.forwarding=1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y jq lcov
          apt-get install -y libglib2.0-dev libdbus-1-dev libevent-dev
          apt-get install -y --no-install-recommends gnupg
          
      - name: Checkout submodules & Bootstrap
        uses: ./.github/actions/checkout-submodules-and-bootstrap
        with:
          platform: linux
          bootstrap-log-name: bootstrap-logs-codecov-linux

      - name: Run Build Coverage
        run: ./scripts/build_coverage.sh --yaml --xml          

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: out/coverage/coverage/html/**
          name: coverage-xml
          path: out/coverage/coverage/coverage.xml
          retention-days: 30
          overwrite: true
