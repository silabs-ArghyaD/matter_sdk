name: Code-Coverage LCOV

on:
  pull_request:
  push:
    branches: [ master, 'v*-branch' ]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-coverage-${{ (github.event_name == 'pull_request' && github.event.number) || (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write  
  pull-requests: write
  pages: write
  id-token: write

env:
  CHIP_NO_LOG_TIMESTAMPS: true

jobs:
  linux-coverage:
    name: Coverage
    if: github.actor != 'restyled-io[bot]'
    
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/project-chip/chip-build:167
      volumes:
        - "/:/runner-root-volume"
        - "/tmp/log_output:/tmp/test_logs"      
      options: --privileged --sysctl "net.ipv6.conf.all.disable_ipv6=0 net.ipv4.conf.all.forwarding=1 net.ipv6.conf.all.forwarding=1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y jq lcov
          apt-get install -y libglib2.0-dev libdbus-1-dev
          
      - name: Checkout submodules & Bootstrap
        uses: ./.github/actions/checkout-submodules-and-bootstrap
        with:
          platform: linux
          bootstrap-log-name: bootstrap-logs-codecov

      - name: Run Build Coverage
        run: ./scripts/build_coverage.sh --yaml --xml
      
      - name: Generate Coverage Summary
        run: |
          # Generate a human-readable coverage summary
          lcov --summary out/coverage/coverage/coverage.info > coverage-summary.txt 2>&1 || true
          
          # Parse XML directly from the first line to extract coverage data
          if [ -f "out/coverage/coverage/coverage.xml" ]; then
            python3 -c '
          import xml.etree.ElementTree as ET
          import sys
          import os
          
          try:
              # Parse the XML file
              tree = ET.parse("out/coverage/coverage/coverage.xml")
              root = tree.getroot()
              
              # Extract coverage attributes from the root coverage element
              line_rate = root.get("line-rate", "0")
              branch_rate = root.get("branch-rate", "0") 
              lines_covered = root.get("lines-covered", "0")
              lines_valid = root.get("lines-valid", "0")
              branches_covered = root.get("branches-covered", "0")
              branches_valid = root.get("branches-valid", "0")
              timestamp = root.get("timestamp", "0")
              
              # Convert to percentages
              line_percentage = float(line_rate) * 100
              branch_percentage = float(branch_rate) * 100
              
              # Generate report
              print(f"## 📊 Coverage Report")
              print(f"")
              print(f"**Overall Coverage Metrics:**")
              print(f"- **Line Coverage:** {line_percentage:.1f}% ({lines_covered}/{lines_valid} lines)")
              print(f"- **Branch Coverage:** {branch_percentage:.1f}% ({branches_covered}/{branches_valid} branches)")
              print(f"")
              
              # Add coverage quality indicator
              if line_percentage >= 80:
                  quality = "🟢 Excellent"
              elif line_percentage >= 60:
                  quality = "🟡 Good" 
              elif line_percentage >= 40:
                  quality = "🟠 Fair"
              else:
                  quality = "🔴 Needs Improvement"
              
              print(f"**Coverage Quality:** {quality}")
              print(f"")
              
          except Exception as e:
              print(f"## 📊 Coverage Report")
              print(f"❌ Error parsing coverage data: {str(e)}")
              print(f"")
              # Try to show first few lines of XML for debugging
              try:
                  with open("out/coverage/coverage/coverage.xml", "r") as f:
                      lines = f.readlines()[:3]
                      print(f"**XML Preview:**")
                      for line in lines:
                          print(f"`{line.strip()}`")
              except:
                  print("Could not read XML file")
          ' > coverage-report.md
          
            # Debug: Show if the report was generated
            echo "Generated coverage-report.md:"
            cat coverage-report.md || echo "Failed to generate report"
          else
            echo "## 📊 Coverage Report" > coverage-report.md
            echo "❌ Coverage XML file not found" >> coverage-report.md
          fi

      - name: Prepare GitHub Pages Content
        run: |
          # Create pages directory structure
          mkdir -p pages
          
          # Determine the target directory based on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_DIR="pages/pr-${{ github.event.number }}"
            REPORT_URL="${{ github.repository }}/pr-${{ github.event.number }}"
          else
            TARGET_DIR="pages/branch-$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g')"
            REPORT_URL="${{ github.repository }}/branch-$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g')"
          fi
          
          # Copy HTML coverage report
          mkdir -p "$TARGET_DIR"
          cp -r out/coverage/coverage/html/* "$TARGET_DIR/"
          
          # Create/update index page
          cat > pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Coverage Reports</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  .report { border: 1px solid #ddd; padding: 20px; margin: 10px 0; border-radius: 5px; }
                  .pr { background-color: #f8f9fa; }
                  .branch { background-color: #e8f5e9; }
                  .timestamp { color: #666; font-size: 0.9em; }
                  a { text-decoration: none; color: #0366d6; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <h1>📊 Coverage Reports</h1>
              <div id="reports"></div>
              <script>
                  // This will be updated by the workflow to list available reports
                  const reports = [];
              </script>
          </body>
          </html>
          EOF
          
          # Store report info for the comment
          echo "REPORT_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$REPORT_URL" >> $GITHUB_ENV
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            out/coverage/coverage/coverage.xml
            out/coverage/coverage/coverage.info
            out/coverage/coverage/html/**
            coverage-summary.txt
            coverage-report.md
            pages/**
          retention-days: 30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          destination_dir: coverage
          keep_files: true
          commit_message: "Deploy coverage report for ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }}"

      - name: Comment Coverage Report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let coverageReport = '';
            try {
              if (fs.existsSync('coverage-report.md')) {
                coverageReport = fs.readFileSync('coverage-report.md', 'utf8');
                console.log('Coverage report content:', coverageReport);
              } else {
                console.log('coverage-report.md not found');
                coverageReport = '## 📊 Coverage Report\n❌ Coverage report file not found';
              }
            } catch (error) {
              console.log('Error reading coverage report:', error);
              coverageReport = '## 📊 Coverage Report\n❌ Could not read coverage report: ' + error.message;
            }
            
            // Add GitHub Pages link
            const reportUrl = process.env.REPORT_URL;
            const pagesMessage = `
            ## 🌐 Interactive Coverage Report
            
            **[📊 View Full HTML Coverage Report](${reportUrl})**
            
            ## 📎 Additional Reports:

            1. **Download Artifacts:** Go to the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and download \`coverage-report\`
            2. **Machine Processing:** Use \`coverage.xml\` (Cobertura format) or \`coverage.info\` (LCOV format) for tooling integration

            ---
            *Coverage report updated on: ${new Date().toISOString()}*
            `;
            
            const body = coverageReport + pagesMessage;
            
            // Find existing coverage comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('📊 Coverage Report')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
